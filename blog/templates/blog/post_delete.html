{% extends 'base.html' %}

{% block title %} Supprimer l'article {% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-5 text-center">
                <div class="mb-4 text-danger">
                    <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
                </div>
                <h2 class="fw-bold text-dark mb-3">Confirmer la suppression</h2>
                <p class="text-muted mb-5">Êtes-vous sûr de vouloir supprimer l'article <strong>"{{ post.title }}"</strong> ? Cette action est irréversible.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger py-3 rounded-pill fw-bold">
                            <i class="fa-solid fa-trash-can me-2"></i> Oui, supprimer
                        </button>
                        <a href="{% url 'post_detail' post.pk %}" class="btn btn-link text-muted text-decoration-none">Non, annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
