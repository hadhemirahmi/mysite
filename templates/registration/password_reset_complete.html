{% extends "base.html" %}

{% block title %} Mot de passe changé {% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-sm rounded-5 p-5">
            <div class="mb-4 text-success">
                <i class="fa-solid fa-circle-check fa-4x"></i>
            </div>
            <h2 class="fw-bold text-dark mb-3">Félicitations !</h2>
            <p class="text-muted mb-5">Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter en toute sécurité.</p>
            <div class="d-grid gap-2">
                <a href="{% url 'login' %}" class="btn btn-primary py-3 rounded-pill fw-bold shadow-sm">
                    Se connecter
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
