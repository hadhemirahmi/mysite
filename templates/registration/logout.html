{% extends "base.html" %}

{% block title %} Déconnexion {% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-sm rounded-5 p-5">
            <div class="mb-4 text-primary opacity-25">
                <i class="fa-solid fa-person-walking-arrow-right fa-4x"></i>
            </div>
            <h2 class="fw-bold text-dark mb-3">Au revoir !</h2>
            <p class="text-muted mb-5">Vous avez été déconnecté avec succès. Merci de votre visite.</p>
            <div class="d-grid gap-2">
                <a href="{% url 'login' %}" class="btn btn-primary py-3 rounded-pill fw-bold shadow-sm">
                    Se reconnecter
                </a>
                <a href="{% url 'accueil' %}" class="btn btn-link text-muted text-decoration-none">Retour au portail</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
