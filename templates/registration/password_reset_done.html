{% extends "base.html" %}

{% block title %} E-mail envoyé {% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-sm rounded-5 p-5">
            <div class="mb-4 text-success">
                <i class="fa-solid fa-paper-plane fa-4x"></i>
            </div>
            <h2 class="fw-bold text-dark mb-3">Vérifiez votre boîte mail</h2>
            <p class="text-muted mb-5">Nous vous avons envoyé des instructions pour réinitialiser votre mot de passe. Si vous ne recevez rien, vérifiez vos courriers indésirables.</p>
            <div class="d-grid gap-2">
                <a href="{% url 'login' %}" class="btn btn-primary py-3 rounded-pill fw-bold shadow-sm">
                    Retour à la connexion
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
